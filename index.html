<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Moja strona</title>
<style>
  :root { --bg:#0f172a; --fg:#f1f5f9; --muted:#94a3b8; --accent:#f97316; --sidebar:#1e293b; --border:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  .wrap { max-width:1080px; margin:0 auto; padding:48px 24px; display:grid; gap:32px; grid-template-columns:1fr; }
  
  main { min-width:0; }
  h1 { font-size:clamp(2rem,5vw,3rem); margin:0 0 12px; color:var(--accent); letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:1.125rem; margin:0 0 32px; }
  p { margin:0 0 16px; }
  img { max-width:100%; height:auto; border-radius:8px; margin:16px 0; }
  hr { border:0; border-top:1px solid var(--border); margin:32px 0; }
  .cta { display:inline-block; margin:16px 8px 16px 0; padding:14px 28px; background:var(--accent); color:#fff; text-decoration:none; border-radius:8px; font-weight:600; }
  .cta:hover { background:#ea580c; }
  .sidebar { background:var(--sidebar); border:1px solid var(--border); border-radius:12px; padding:20px; height:fit-content; }
  .sidebar h3 { margin:0 0 12px; font-size:1rem; color:var(--accent); }
  .sidebar ul { list-style:none; margin:0; padding:0; }
  .sidebar li { padding:6px 0; border-bottom:1px solid var(--border); }
  .sidebar li:last-child { border-bottom:0; }
  .sidebar a { color:var(--fg); text-decoration:none; }
  .sidebar a:hover { color:var(--accent); }
  footer { margin-top:64px; padding-top:24px; border-top:1px solid var(--border); color:var(--muted); font-size:.875rem; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1>Hi, i’m Ewewerban 👋</h1>
      <p class="sub">Im writing articles on minewiki.pl and im making free webpages for all</p>
      <p>I dont really know what to write here so i will paste some links here</p>
      <a class="cta" href="">📱Discord</a>
      <a class="cta" href="https://cuplink.to/ewewerban">☕️ Buy me a coffe</a>
      <footer>© 2026 Moja strona</footer>
    </main>

  </div>
</body>
</html>
